<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>雅思单词馆 · IELTS Vocab Lab</title>
<style>
:root {
  --bg: #0f1419;
  --bg2: #1a2332;
  --card: #243044;
  --border: #334155;
  --text: #e8eef7;
  --muted: #94a3b8;
  --accent: #3b82f6;
  --accent2: #60a5fa;
  --ok: #22c55e;
  --bad: #ef4444;
  --warn: #f59e0b;
  --radius: 14px;
  --shadow: 0 8px 24px rgba(0,0,0,.35);
  --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100%; }
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }

.wrap { max-width: 960px; margin: 0 auto; padding: 16px; padding-bottom: 88px; }
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(15,20,25,.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.nav-inner { max-width: 960px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 1.05rem; color: #fff; white-space: nowrap; }
.brand span { color: var(--accent2); }
.nav-links { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.nav-links a {
  color: var(--muted); padding: 6px 10px; border-radius: 999px; font-size: .9rem;
}
.nav-links a.active, .nav-links a:hover { background: var(--card); color: #fff; text-decoration: none; }

.card {
  background: linear-gradient(180deg, var(--bg2), #162033);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
}
.card h2, .card h3 { margin: 0 0 10px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat { background: var(--card); border-radius: 12px; padding: 14px; border: 1px solid var(--border); }
.stat .n { font-size: 1.6rem; font-weight: 700; }
.stat .l { font-size: .85rem; color: var(--muted); }

label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
input, textarea, select {
  width: 100%; background: #0b1220; color: var(--text);
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 1rem;
}
textarea { min-height: 110px; resize: vertical; font-family: inherit; }
.field { margin-bottom: 12px; }

.btn {
  appearance: none; border: none; cursor: pointer;
  background: var(--accent); color: #fff; font-weight: 600;
  padding: 10px 16px; border-radius: 10px; font-size: .95rem;
}
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn.ok { background: var(--ok); }
.btn.bad { background: var(--bad); }
.btn.warn { background: var(--warn); color: #111; }
.btn.sm { padding: 6px 10px; font-size: .85rem; }

.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .75rem; background: var(--card); color: var(--muted); }
.pill.ok { background: rgba(34,197,94,.15); color: var(--ok); }
.pill.bad { background: rgba(239,68,68,.15); color: var(--bad); }

.table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.table th, .table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
.table th { color: var(--muted); font-weight: 600; }

.q-card { margin-bottom: 16px; }
.q-prompt { font-size: 1.05rem; margin-bottom: 10px; font-weight: 600; }
.options { display: grid; gap: 8px; }
.option {
  display: block; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
  background: #0b1220; cursor: pointer;
}
.option:has(input:checked) { border-color: var(--accent); background: rgba(59,130,246,.15); }
.option input { width: auto; margin-right: 8px; }

.result-item { padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--border); }
.result-item.ok { border-color: rgba(34,197,94,.4); background: rgba(34,197,94,.08); }
.result-item.bad { border-color: rgba(239,68,68,.4); background: rgba(239,68,68,.08); }

.login-box { max-width: 380px; margin: 12vh auto; }
.score-big { font-size: 2.4rem; font-weight: 800; }
.bar { height: 10px; background: #0b1220; border-radius: 999px; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #22c55e); }

.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px;
  border: 1px solid var(--border); z-index: 100; display: none;
}
.toast.show { display: block; }

.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  background: rgba(15,20,25,.96); border-top: 1px solid var(--border);
  display: none; justify-content: space-around; padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
}
.bottom-nav a { color: var(--muted); font-size: .72rem; text-align: center; padding: 4px; }
.bottom-nav a.active { color: var(--accent2); }
.bottom-nav .ico { display: block; font-size: 1.15rem; }

.speak-box {
  min-height: 120px; background: #0b1220; border: 1px dashed var(--border);
  border-radius: 12px; padding: 14px; white-space: pre-wrap;
}
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); display: inline-block; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }

@media (max-width: 720px) {
  .bottom-nav { display: flex; }
  .nav-links { display: none; }
}

.hidden{display:none!important}
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabbar .btn{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.tabbar .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner">
  <a class="brand" href="#" onclick="show('home')">雅思<span>单词馆</span></a>
  <div class="nav-links" id="topNav"></div>
  <button class="btn ghost sm" onclick="logout()">退出</button>
</div></nav>

<div id="loginView" class="wrap">
  <div class="card login-box">
    <h2>雅思单词馆</h2>
    <p class="muted">IELTS Vocab Lab · 请输入访问码</p>
    <div class="field"><label>访问码 PIN</label><input id="pin" type="password" placeholder="输入 PIN"/></div>
    <button type="button" class="btn" id="btnLogin" style="width:100%">进入</button>
    <p id="loginErr" style="color:var(--bad)"></p>
  </div>
</div>

<main id="appView" class="wrap hidden">
  <div class="tabbar" id="tabs"></div>
  <div id="view-home"></div>
  <div id="view-words" class="hidden"></div>
  <div id="view-quiz" class="hidden"></div>
  <div id="view-review" class="hidden"></div>
  <div id="view-speaking" class="hidden"></div>
  <div id="view-dash" class="hidden"></div>
  <div id="view-admin" class="hidden"></div>
</main>

<nav class="bottom-nav" id="bottomNav"></nav>
<div class="toast" id="toast"></div>

<script>
const PIN = "ielts2026";
const SEED = [{"word": "analyse", "phonetic": "/ˈænəlaɪz/", "definition_en": "to examine something in detail", "definition_cn": "分析；细察", "example": "Researchers analyse the data carefully.", "pos": "v."}, {"word": "approach", "phonetic": "/əˈprəʊtʃ/", "definition_en": "a way of dealing with something; to come near", "definition_cn": "方法；接近", "example": "A new approach to teaching languages.", "pos": "n./v."}, {"word": "assess", "phonetic": "/əˈses/", "definition_en": "to evaluate or estimate the nature or quality of", "definition_cn": "评估；评定", "example": "Teachers assess students' progress regularly.", "pos": "v."}, {"word": "concept", "phonetic": "/ˈkɒnsept/", "definition_en": "an abstract idea or general notion", "definition_cn": "概念；观念", "example": "The concept of democracy is complex.", "pos": "n."}, {"word": "consist", "phonetic": "/kənˈsɪst/", "definition_en": "to be composed or made up of", "definition_cn": "由…组成", "example": "The committee consists of ten members.", "pos": "v."}, {"word": "constitute", "phonetic": "/ˈkɒnstɪtjuːt/", "definition_en": "to be a part of a whole; to form", "definition_cn": "构成；组成", "example": "Women constitute about half of the workforce.", "pos": "v."}, {"word": "context", "phonetic": "/ˈkɒntekst/", "definition_en": "the circumstances that form the setting for an event", "definition_cn": "语境；背景", "example": "You must consider the historical context.", "pos": "n."}, {"word": "distribute", "phonetic": "/dɪˈstrɪbjuːt/", "definition_en": "to give out or spread over an area", "definition_cn": "分发；分配", "example": "The charity distributed food to the poor.", "pos": "v."}, {"word": "economy", "phonetic": "/ɪˈkɒnəmi/", "definition_en": "the system of trade and industry of a country", "definition_cn": "经济；节约", "example": "The global economy is recovering slowly.", "pos": "n."}, {"word": "environment", "phonetic": "/ɪnˈvaɪrənmənt/", "definition_en": "the natural world or surrounding conditions", "definition_cn": "环境", "example": "Protecting the environment is crucial.", "pos": "n."}, {"word": "establish", "phonetic": "/ɪˈstæblɪʃ/", "definition_en": "to set up on a firm or permanent basis", "definition_cn": "建立；确立", "example": "They established a new research centre.", "pos": "v."}, {"word": "estimate", "phonetic": "/ˈestɪmeɪt/", "definition_en": "to roughly calculate or judge the value", "definition_cn": "估计；估价", "example": "Experts estimate the cost at £2 million.", "pos": "v./n."}, {"word": "evidence", "phonetic": "/ˈevɪdəns/", "definition_en": "facts or information indicating whether a belief is true", "definition_cn": "证据；依据", "example": "There is clear evidence of climate change.", "pos": "n."}, {"word": "factor", "phonetic": "/ˈfæktə/", "definition_en": "a circumstance that contributes to a result", "definition_cn": "因素；要素", "example": "Cost was a major factor in their decision.", "pos": "n."}, {"word": "function", "phonetic": "/ˈfʌŋkʃn/", "definition_en": "an activity or purpose natural to something", "definition_cn": "功能；作用", "example": "The function of the heart is to pump blood.", "pos": "n./v."}, {"word": "identify", "phonetic": "/aɪˈdentɪfaɪ/", "definition_en": "to recognize or establish as being a particular person or thing", "definition_cn": "识别；确认", "example": "Can you identify the author of this text?", "pos": "v."}, {"word": "indicate", "phonetic": "/ˈɪndɪkeɪt/", "definition_en": "to point out or show", "definition_cn": "表明；指示", "example": "Recent studies indicate a rise in temperatures.", "pos": "v."}, {"word": "interpret", "phonetic": "/ɪnˈtɜːprɪt/", "definition_en": "to explain the meaning of something", "definition_cn": "解释；口译", "example": "How do you interpret these results?", "pos": "v."}, {"word": "involve", "phonetic": "/ɪnˈvɒlv/", "definition_en": "to include as a necessary part or result", "definition_cn": "涉及；包含", "example": "The job involves a lot of travel.", "pos": "v."}, {"word": "significant", "phonetic": "/sɪɡˈnɪfɪkənt/", "definition_en": "sufficiently great or important to be worthy of attention", "definition_cn": "重要的；显著的", "example": "There has been a significant improvement.", "pos": "adj."}, {"word": "theory", "phonetic": "/ˈθɪəri/", "definition_en": "a system of ideas intended to explain something", "definition_cn": "理论；学说", "example": "Darwin's theory of evolution.", "pos": "n."}, {"word": "variable", "phonetic": "/ˈveəriəbl/", "definition_en": "likely to change; a factor that can change", "definition_cn": "可变的；变量", "example": "Temperature is a key variable in the experiment.", "pos": "n./adj."}];
const KEY = "ielts_vocab_lab_v1";

const NAV = [
  ["home","首页"],["words","词库"],["quiz","新词测验"],["review","记忆复习"],
  ["speaking","口语练习"],["dash","每日评分"],["admin","录入/管理"]
];

function today(){ return new Date().toISOString().slice(0,10); }
function now(){ return new Date().toISOString(); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("show"),2600); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])); }

let memoryStore = null;
let storageOk = true;
function safeGet(key){
  try { return localStorage.getItem(key); }
  catch(e){ storageOk = false; return memoryStore; }
}
function safeSet(key, val){
  try { localStorage.setItem(key, val); memoryStore = val; return true; }
  catch(e){ storageOk = false; memoryStore = val; return false; }
}
function emptyDb(){ return { words:[], cards:{}, quizzes:[], speaking:[], daily:{}, authed:false }; }
function load(){
  try {
    const raw = safeGet(KEY);
    if(raw){
      try {
        const parsed = JSON.parse(raw);
        if(parsed && typeof parsed === "object"){
          parsed.words = parsed.words || [];
          parsed.cards = parsed.cards || {};
          parsed.quizzes = parsed.quizzes || [];
          parsed.speaking = parsed.speaking || [];
          parsed.daily = parsed.daily || {};
          return parsed;
        }
      } catch(e){}
    }
    const db = emptyDb();
    SEED.forEach(w => addWordObj(db, {...w, batch_date:"2026-10-26"}, true));
    save(db);
    return db;
  } catch(e){
    console.error("load failed", e);
    storageOk = false;
    const db = emptyDb();
    try { SEED.forEach(w => addWordObj(db, {...w, batch_date:"2026-10-26"}, true)); } catch(_){}
    return db;
  }
}
function save(db){
  try { safeSet(KEY, JSON.stringify(db)); }
  catch(e){ storageOk = false; console.warn("save failed", e); }
}
let DB;
try { DB = load(); }
catch(e){ storageOk = false; DB = emptyDb(); console.error(e); }

function addWordObj(db, w, silent){
  const word = (w.word||"").trim();
  if(!word) return null;
  let existing = db.words.find(x => x.word.toLowerCase()===word.toLowerCase());
  if(existing){
    Object.assign(existing, { phonetic:w.phonetic||existing.phonetic, definition_en:w.definition_en||existing.definition_en,
      definition_cn:w.definition_cn||existing.definition_cn, example:w.example||existing.example, pos:w.pos||existing.pos,
      collocations:w.collocations||existing.collocations||"",
      batch_date:w.batch_date||existing.batch_date });
    if(!silent) save(db); return existing;
  }
  const id = (db.words.reduce((m,x)=>Math.max(m,x.id),0)||0)+1;
  const obj = { id, word, phonetic:w.phonetic||"", definition_en:w.definition_en||"", definition_cn:w.definition_cn||"",
    example:w.example||"", pos:w.pos||"", collocations:w.collocations||"", batch_date:w.batch_date||today(), created_at:now() };
  db.words.push(obj);
  db.cards[id] = { ease:2.5, interval:0, reps:0, next:today(), last:null };
  if(!silent) save(db); return obj;
}

/* SM-2 */
function sm2(q, reps, ef, interval){
  q=Math.max(0,Math.min(5,q|0));
  if(q<3){ reps=0; interval=1; }
  else {
    if(reps===0) interval=1; else if(reps===1) interval=6; else interval=Math.max(1, Math.round(interval*ef));
    reps++;
  }
  ef = ef + (0.1 - (5-q)*(0.08+(5-q)*0.02));
  if(ef<1.3) ef=1.3;
  return {reps, ef:Math.round(ef*100)/100, interval};
}
function nextDate(days){ const d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function dueCards(){ return DB.words.filter(w => (DB.cards[w.id]?.next||today()) <= today()); }

function recomputeDaily(day){
  day=day||today();
  const qs = DB.quizzes.filter(x=>x.date===day && x.type==="new");
  const rs = DB.quizzes.filter(x=>x.date===day && x.type==="review");
  const ss = DB.speaking.filter(x=>x.date===day);
  const avg = a => a.length? Math.round(a.reduce((s,x)=>s+x.score,0)/a.length*10)/10 : null;
  const quiz=avg(qs), review=avg(rs), speaking=avg(ss);
  const parts=[quiz,review,speaking].filter(x=>x!=null);
  const total = parts.length? Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*10)/10 : null;
  DB.daily[day]={quiz,review,speaking,total,updated:now()};
  save(DB);
}

/* Quiz gen */
const QTYPES=["mc_en2cn","mc_cn2en","fill_spell","fill_cn2en","fill_en2cn"];
function distractors(ans, pool, k=3){
  const o=pool.filter(x=>x&&x!==ans); shuffle(o); return o.slice(0,k);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function makeQuiz(words, n=15){
  const all=DB.words; const sel=shuffle(words.slice()).slice(0,n);
  return sel.map((w,i)=>{
    const t=QTYPES[i%QTYPES.length];
    if(t==="mc_en2cn"){
      const answer=w.definition_cn||w.definition_en||w.word;
      const opts=shuffle(distractors(answer, all.map(x=>x.definition_cn||x.definition_en||x.word)).concat([answer]));
      return {type:t,word_id:w.id,word:w.word,prompt:`选择 “${w.word}” 的中文释义`,options:opts,answer,hint:w.phonetic||""};
    }
    if(t==="mc_cn2en"){
      const answer=w.word;
      const opts=shuffle(distractors(answer, all.map(x=>x.word)).concat([answer]));
      return {type:t,word_id:w.id,word:w.word,prompt:`选择与 “${w.definition_cn||w.definition_en}” 对应的英文单词`,options:opts,answer,hint:w.pos||""};
    }
    if(t==="fill_spell"){
      const letters=shuffle(w.word.split(""));
      return {type:t,word_id:w.id,word:w.word,prompt:`根据释义拼写单词：${w.definition_cn||w.definition_en}`,answer:w.word,hint:`音标 ${w.phonetic||"—"} · 乱序 ${letters.join(" ")}`};
    }
    if(t==="fill_cn2en"){
      return {type:t,word_id:w.id,word:w.word,prompt:`写出英文：${w.definition_cn||w.definition_en}`,answer:w.word,hint:`${w.pos||""} ${w.phonetic||""}`};
    }
    return {type:t,word_id:w.id,word:w.word,prompt:`写出 “${w.word}” 的中文释义`,answer:w.definition_cn||w.definition_en||"",hint:w.example||""};
  });
}
function grade(q, ua){
  ua=(ua||"").trim(); const correct=(q.answer||"").trim(); let ok=false; let fb="";
  if(q.type.startsWith("mc")||q.type==="fill_spell"||q.type==="fill_cn2en"){
    ok=ua.toLowerCase()===correct.toLowerCase();
    fb=ok?"正确！":`正确答案：${correct}`;
  } else {
    if(!ua) ok=false;
    else if(ua.toLowerCase()===correct.toLowerCase() || (correct && (correct.includes(ua)||ua.includes(correct)))) ok=true;
    else {
      const tokens=correct.replace(/[；;，,/]/g,",").split(",").map(s=>s.trim()).filter(Boolean);
      ok=tokens.some(t=>ua.includes(t));
    }
    fb=ok?"释义正确！":`参考释义：${correct}`;
  }
  return {word_id:q.word_id,word:q.word,type:q.type,prompt:q.prompt,user_answer:ua,correct_answer:correct,is_correct:ok,feedback:fb};
}
function applyReview(word_id, quality){
  const c=DB.cards[word_id]; if(!c) return;
  const u=sm2(quality,c.reps,c.ease,c.interval);
  c.reps=u.reps; c.ease=u.ef; c.interval=u.interval; c.next=nextDate(u.interval); c.last=today();
}

function doLogin(){
  try {
    const el = document.getElementById("pin");
    const p = (el && el.value ? el.value : "").trim();
    const err = document.getElementById("loginErr");
    if(p !== PIN){ if(err) err.textContent = "访问码错误"; return; }
    if(err) err.textContent = (typeof storageOk !== "undefined" && !storageOk)
      ? "已进入（当前浏览器无法持久保存，刷新后需重新登录）" : "";
    DB.authed = true;
    save(DB);
    enterApp();
    syncRemoteWords();
  } catch (e) {
    const err = document.getElementById("loginErr");
    if(err) err.textContent = "登录失败：" + (e && e.message ? e.message : e);
    console.error(e);
  }
}
function logout(){ DB.authed=false; save(DB); location.reload(); }

function enterApp(){
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  const tabs=document.getElementById("tabs");
  const top=document.getElementById("topNav");
  const bot=document.getElementById("bottomNav");
  tabs.innerHTML=NAV.map(([k,l])=>`<button class="btn sm" data-v="${k}">${l}</button>`).join("");
  top.innerHTML=NAV.map(([k,l])=>`<a href="#" data-v="${k}">${l}</a>`).join("");
  bot.innerHTML=`
    <a href="#" data-v="home"><span class="ico">🏠</span>首页</a>
    <a href="#" data-v="quiz"><span class="ico">📝</span>测验</a>
    <a href="#" data-v="review"><span class="ico">🔁</span>复习</a>
    <a href="#" data-v="speaking"><span class="ico">🎤</span>口语</a>
    <a href="#" data-v="dash"><span class="ico">📊</span>评分</a>`;
  document.querySelectorAll("[data-v]").forEach(el=>el.onclick=e=>{e.preventDefault(); show(el.dataset.v);});
  show("home");
}

function show(name){
  NAV.forEach(([k])=>{
    const v=document.getElementById("view-"+k); if(v) v.classList.toggle("hidden", k!==name);
  });

function startRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast("当前浏览器不支持语音识别，请用 Chrome/Edge，或直接打字"); document.getElementById("transcript").focus(); return; }
  sp.rec=new SR(); sp.rec.lang="en-US"; sp.rec.continuous=true; sp.rec.interimResults=true;
  let finalText=document.getElementById("transcript").textContent||"";
  sp.rec.onstart=()=>{ sp.recognizing=true; document.getElementById("btnRec").disabled=true; document.getElementById("btnStop").disabled=false;
    document.getElementById("recStatus").innerHTML='<span class="rec-dot"></span> 正在聆听…'; };
  sp.rec.onend=()=>{ sp.recognizing=false; document.getElementById("btnRec").disabled=false; document.getElementById("btnStop").disabled=true;
    document.getElementById("recStatus").textContent="已停止。可修改文本后提交。"; };
  sp.rec.onerror=e=>{ document.getElementById("recStatus").textContent="识别错误："+(e.error||""); };
  sp.rec.onresult=ev=>{
    let interim="";
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const res=ev.results[i], t=res[0].transcript;
      if(res.isFinal){
        finalText+=(finalText?" ":"")+t.trim();
        if(typeof res[0].confidence==="number")
          sp.conf = sp.conf==null?res[0].confidence:(sp.conf+res[0].confidence)/2;
        const tw=(sp.prompts[sp.cur]?.word||"").toLowerCase();
        if(tw && !t.toLowerCase().includes(tw) && sp.conf!=null && sp.conf<0.7){
          if(!sp.mismatches.includes(sp.prompts[sp.cur].word)) sp.mismatches.push(sp.prompts[sp.cur].word);
        }
      } else interim+=t;
    }
    document.getElementById("transcript").textContent=(finalText+(interim?" "+interim:"")).trim();
  };
  sp.rec.start();
}
function stopRec(){ if(sp.rec&&sp.recognizing) sp.rec.stop(); }

const GRAM=[
  [/\bi am go\b/i,"应为 I am going / I go"],
  [/\bhe go\b/i,"第三人称单数：he goes"],
  [/\bshe go\b/i,"第三人称单数：she goes"],
  [/\bmore better\b/i,"better 已是比较级，勿再加 more"],
  [/\bin nowadays\b/i,"nowadays 前通常不加 in"],
  [/\bdiscuss about\b/i,"discuss 后直接接宾语，去掉 about"],
  [/\binformations\b/i,"information 不可数"],
  [/\badvices\b/i,"advice 不可数"],
  [/\bi has\b/i,"应为 I have"],
  [/\bthey was\b/i,"应为 they were"],
  [/\bthere is many\b/i,"many 后用 there are"],
];
function gradeSpeaking(){
  stopRec();
  const text=(document.getElementById("transcript").textContent||"").trim();
  if(!text){ toast("请先说话或输入英文"); return; }
  const fb=[]; const lower=text.toLowerCase();
  GRAM.forEach(([re,msg])=>{ if(re.test(text)) fb.push({type:"grammar",zh:"语法："+msg}); });
  const used=[], missing=[];
  sp.words.forEach(w=>{ if(lower.includes(w.toLowerCase())) used.push(w); else missing.push(w); });
  if(missing.length) fb.push({type:"vocab",zh:"词汇：尽量用上这些词 — "+missing.join(", ")});
  if(sp.conf!=null && sp.conf<0.55) fb.push({type:"pronunciation",zh:"发音：识别不太稳定，请放慢语速、吐字更清晰后再试"});
  if(sp.mismatches.length) fb.push({type:"pronunciation",zh:"发音：这些词可能读得不准 — "+sp.mismatches.join(", ")});
  if(!fb.length) fb.push({type:"ok",zh:"很好！未发现明显语法/发音问题。"});
  const vocab=sp.words.length? 100*used.length/sp.words.length : 70;
  const gpen=Math.min(40, 8*fb.filter(f=>f.type==="grammar").length);
  const ppen=Math.min(30, 10*fb.filter(f=>f.type==="pronunciation").length);
  const len=text.split(/\\s+/).length>=20?10:(text.split(/\\s+/).length>=8?5:0);
  const score=Math.max(0,Math.min(100, Math.round((vocab-gpen-ppen+len)*10)/10));
  DB.speaking.unshift({id:Date.now(),date:today(),score,transcript:text,feedback:fb,words:sp.words.join(","),created:now()});
  recomputeDaily();
  document.getElementById("spResult").classList.remove("hidden");
  document.getElementById("spResult").innerHTML=`<h2>本轮口语评分</h2><div class="score-big">${score} 分</div>
    <p>已使用目标词：${esc(used.join(", ")||"无")}</p>
    <p>未使用：${esc(missing.join(", ")||"无")}</p>
    ${fb.map(f=>`<div class="result-item ${f.type==="ok"?"ok":"bad"}">${esc(f.zh)}</div>`).join("")}
    <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="loadSpeaking()">继续练习</button>
    <button class="btn" onclick="show('dash')">每日评分</button></div>`;
  toast("口语评分已计入今日综合分");
}

function needsEnrich(w){
  if(!w) return true;
  return !(w.definition_en && w.definition_cn && w.pos && w.example && w.collocations);
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function setImportProgress(msg){
  const el = document.getElementById("importProgress");
  if(el) el.textContent = msg || "";
}
async function fetchJson(url){
  const r = await fetch(url, { cache: "no-store" });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function pickCollocations(entry, example){
  const bits = [];
  try {
    const meanings = entry && entry.meanings || [];
    meanings.slice(0,2).forEach(m => {
      (m.definitions||[]).slice(0,2).forEach(d => {
        (d.synonyms||[]).slice(0,2).forEach(s => bits.push(s));
      });
      (m.synonyms||[]).slice(0,2).forEach(s => bits.push(s));
    });
  } catch(_){}
  if(example){
    const clipped = String(example).replace(/\s+/g," ").trim();
    if(clipped) bits.push(clipped.length>80 ? clipped.slice(0,77)+"..." : clipped);
  }
  const seen = new Set();
  const out = [];
  bits.forEach(b => {
    const k = String(b).toLowerCase();
    if(!k || seen.has(k)) return;
    seen.add(k); out.push(String(b));
  });
  return out.slice(0,4).join("; ");
}
async function translateToZh(text){
  const q = String(text||"").trim();
  if(!q) return "";
  try {
    const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(q.slice(0,200)) + "&langpair=en|zh-CN";
    const data = await fetchJson(url);
    const translated = data && data.responseData && data.responseData.translatedText;
    if(!translated) return "";
    if(translated.toLowerCase() === q.toLowerCase()) return "";
    return translated.trim();
  } catch(e){
    return "";
  }
}
async function enrichFromDictionary(word){
  const result = { phonetic:"", pos:"", definition_en:"", definition_cn:"", example:"", collocations:"" };
  const q = String(word||"").trim();
  if(!q) return result;
  const candidates = [q];
  if(/\s/.test(q)){
    const parts = q.split(/\s+/).filter(Boolean);
    if(parts.length) candidates.push(parts[parts.length-1]);
  }
  let entry = null;
  for(const cand of candidates){
    try {
      const data = await fetchJson("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(cand.toLowerCase()));
      if(Array.isArray(data) && data[0]){ entry = data[0]; break; }
    } catch(e){}
  }
  if(entry){
    result.phonetic = entry.phonetic || ((entry.phonetics||[]).map(p=>p.text).find(Boolean) || "");
    const meaning = (entry.meanings||[])[0] || {};
    result.pos = meaning.partOfSpeech || "";
    const def0 = ((meaning.definitions||[])[0]) || {};
    result.definition_en = def0.definition || "";
    result.example = def0.example || "";
    if(!result.example){
      for(const mm of (entry.meanings||[])){
        for(const d of (mm.definitions||[])){
          if(d.example){ result.example = d.example; break; }
        }
        if(result.example) break;
      }
    }
    result.collocations = pickCollocations(entry, result.example);
  }
  result.definition_cn = await translateToZh(q);
  if(!result.definition_cn && result.definition_en){
    await sleep(250);
    result.definition_cn = await translateToZh(result.definition_en);
  }
  return result;
}
async function enrichWordObj(w){
  if(!needsEnrich(w)) return w;
  const info = await enrichFromDictionary(w.word);
  const patch = {
    word: w.word,
    phonetic: w.phonetic || info.phonetic || "",
    pos: w.pos || info.pos || "",
    definition_en: w.definition_en || info.definition_en || "",
    definition_cn: w.definition_cn || info.definition_cn || "",
    example: w.example || info.example || "",
    collocations: w.collocations || info.collocations || "",
    batch_date: w.batch_date,
  };
  return addWordObj(DB, patch, true) || w;
}
function renderAdmin(){
  document.getElementById("view-admin").innerHTML=`
  <div class="card">
    <h2>批量导入英文单词</h2>
    <p class="muted">只贴英文单词（每行一个）。提交后将自动尝试补充词性、释义、搭配与例句；若网络失败可把单词发给老师手动补全。</p>
    <p class="muted">也支持词组，例如 <code>take into account</code>。以 <code>#</code> 开头的行会被忽略。</p>
    <div class="field"><label>批次日期</label><input id="bbatch" type="date" value="${today()}"/></div>
    <div class="field"><label>英文单词列表</label>
      <textarea id="bulk" placeholder="analyse&#10;approach&#10;take into account&#10;significant" style="min-height:180px"></textarea>
    </div>
    <button type="button" class="btn" id="btnImport">导入并自动补充</button>
    <p class="muted" id="importProgress" style="margin-top:10px"></p>
  </div>
  <div class="card"><h3>最近单词</h3>
  <div style="overflow:auto"><table class="table"><thead><tr><th>单词</th><th>词性</th><th>中文</th><th>搭配</th><th>批次</th><th></th></tr></thead>
  <tbody>${DB.words.slice().reverse().slice(0,50).map(w=>`<tr>
    <td><strong>${esc(w.word)}</strong></td>
    <td>${esc(w.pos||"—")}</td>
    <td>${esc(w.definition_cn||"（待补充）")}</td>
    <td class="muted">${esc(w.collocations||"—")}</td>
    <td>${esc(w.batch_date||"")}</td>
    <td><button type="button" class="btn bad sm" data-del="${w.id}">删除</button></td>
  </tr>`).join("")}</tbody></table></div></div>`;
  const btn = document.getElementById("btnImport");
  if(btn) btn.onclick = adminImport;
  document.querySelectorAll("button[data-del]").forEach(b=>{
    b.onclick = () => adminDel(+b.dataset.del);
  });
}
async function adminImport(){
  const batch = (document.getElementById("bbatch")||{}).value || today();
  const raw = (document.getElementById("bulk")||{}).value || "";
  const btn = document.getElementById("btnImport");
  const lines = raw.split(String.fromCharCode(10)).map(l=>l.trim()).filter(l=>l && !l.startsWith("#"));
  const words = [];
  const seen = new Set();
  lines.forEach(line=>{
    const word = line.split("|")[0].trim();
    if(!word) return;
    const key = word.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    words.push(word);
  });
  if(!words.length){ toast("请先粘贴英文单词"); return; }
  if(btn) btn.disabled = true;
  let added=0, updated=0;
  const targets = [];
  words.forEach(word=>{
    const before = DB.words.some(w=>w.word.toLowerCase()===word.toLowerCase());
    const obj = addWordObj(DB, { word, batch_date: batch }, true);
    if(before) updated++; else added++;
    if(obj) targets.push(obj);
  });
  save(DB);
  setImportProgress("已写入 "+words.length+" 个词，开始自动补充…");
  let enriched=0, failed=0;
  for(let i=0; i<targets.length; i++){
    const w = targets[i];
    setImportProgress("正在补充第 "+(i+1)+"/"+targets.length+" 个："+w.word);
    try {
      if(needsEnrich(w)){
        await enrichWordObj(w);
        enriched++;
      }
    } catch(e){
      failed++;
      console.warn("enrich failed", w.word, e);
    }
    save(DB);
    if(i < targets.length-1) await sleep(450);
  }
  save(DB);
  setImportProgress("完成：新增 "+added+"，已存在 "+updated+"，尝试补充 "+enriched+(failed?"，失败 "+failed:"")+"。");
  toast("导入完成，已尝试自动补充释义");
  if(btn) btn.disabled = false;
  const bulk = document.getElementById("bulk");
  if(bulk) bulk.value = "";
  renderAdmin();
  setImportProgress("最近一次：新增 "+added+"，已存在 "+updated+"，补充 "+enriched+(failed?"，失败 "+failed:""));
}
function adminDel(id){
  if(!confirm("确认删除？")) return;
  DB.words = DB.words.filter(w=>w.id!==id);
  delete DB.cards[id];
  save(DB);
  toast("已删除");
  renderAdmin();
}


async function syncRemoteWords(){
  try {
    const base = (location.href.split('?')[0]).replace(/index\.html$/, '');
    const urls = [
      base + 'words.json',
      'https://cdn.jsdelivr.net/gh/djession/ielts-vocab-lab@main/words.json',
      'https://raw.githubusercontent.com/djession/ielts-vocab-lab/main/words.json'
    ];
    let items=null;
    for (const u of urls){
      try {
        const r = await fetch(u + (u.includes('jsdelivr')||u.includes('githubusercontent') ? ('?t='+Date.now()) : ''), {cache:'no-store'});
        if(r.ok){ items = await r.json(); break; }
      } catch(e){}
    }
    if(!Array.isArray(items) || !items.length) return;
    let n=0;
    items.forEach(w=>{
      const before = DB.words.some(x=>x.word.toLowerCase()===String(w.word||'').toLowerCase());
      addWordObj(DB, w, true);
      if(!before) n++;
    });
    save(DB);
    if(n) toast('已从词库同步 '+n+' 个新词');
  } catch(e){}
}

if(DB.authed){ enterApp(); syncRemoteWords().then(()=>{ try{renderHome()}catch(e){} }); } else { syncRemoteWords(); }
